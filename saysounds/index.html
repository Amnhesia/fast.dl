<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaySounds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0a09;
    --card: #1a1612;
    --card2: #211c17;
    --line: #2f2822;
    --line2: #3d342b;
    --text: #f1ebe2;
    --muted: #9a8f80;
    --dim: #6c6257;
    --accent: #f0a430;
    --accent2: #ff6a2b;
    --ink: #1b1104;
    --ok: #7ccf7f;
    --bad: #ff6b5b;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(240,164,48,.13), transparent 60%),
      radial-gradient(800px 400px at 100% 100%, rgba(255,106,43,.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 15px/1.5 Inter, system-ui, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  main { max-width: 920px; margin: 0 auto; padding: 36px 16px 70px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
  h1 {
    font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400;
    font-size: 64px; line-height: .9; letter-spacing: 2px; margin: 0;
    background: linear-gradient(180deg, #ffd38a 0%, var(--accent) 45%, var(--accent2) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .quota {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px 7px 10px;
    font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line2); }
  .dots i.on { background: var(--accent); box-shadow: 0 0 8px rgba(240,164,48,.6); }

  .card { background: linear-gradient(180deg, var(--card2), var(--card)); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; }
  .card-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 16px; flex-wrap: wrap; }
  .card-title h2 { margin: 0; font: 600 13px Inter, sans-serif; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }

  .drop {
    position: relative; display: flex; align-items: center; gap: 16px;
    border: 1.5px dashed var(--line2); border-radius: 12px; padding: 18px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: rgba(240,164,48,.05); }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop .icon { flex: 0 0 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: rgba(240,164,48,.12); color: var(--accent); }
  .drop b { display: block; font-weight: 600; word-break: break-all; }
  .drop span { color: var(--muted); font-size: 13px; }

  .wave { margin-top: 16px; display: none; align-items: center; gap: 12px; background: #0f0d0b; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .wave.show { display: flex; }
  .wave canvas { flex: 1; height: 56px; width: 100%; min-width: 0; }
  .wave .time { font: 600 12px Inter, sans-serif; color: var(--muted); min-width: 44px; text-align: right; }

  .play { flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; background: var(--accent); color: var(--ink); display: grid; place-items: center; padding: 0; }
  .play:hover { filter: brightness(1.1); }
  .play svg { width: 16px; height: 16px; }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  @media (max-width: 620px) { .fields { grid-template-columns: 1fr; } h1 { font-size: 52px; } }
  label.lbl { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  label.lbl em { font-style: normal; color: var(--dim); letter-spacing: 0; text-transform: none; font-weight: 500; }
  .namebox { display: flex; align-items: center; background: #0f0d0b; border: 1px solid var(--line2); border-radius: 10px; padding: 0 12px; transition: border-color .15s; }
  .namebox:focus-within { border-color: var(--accent); }
  .namebox input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: 600 18px Inter, sans-serif; padding: 11px 0; letter-spacing: .5px; }
  .namebox .count { font-size: 12px; color: var(--dim); font-weight: 600; }
  .namebox .count.full { color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .vol { display: flex; align-items: center; gap: 12px; height: 46px; }
  .vol output { min-width: 38px; text-align: right; font-weight: 700; color: var(--accent); }

  .toggle { display: inline-flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

  .bar { display: flex; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .btn {
    border: 0; border-radius: 10px; padding: 12px 26px; cursor: pointer;
    font: 700 14px Inter, sans-serif; letter-spacing: .3px;
    background: linear-gradient(180deg, #ffbb52, var(--accent)); color: var(--ink);
    box-shadow: 0 6px 20px -8px rgba(240,164,48,.7);
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .35; cursor: default; filter: none; box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line2); box-shadow: none; }
  .specs { font-size: 12px; color: var(--dim); }

  .status { margin-top: 14px; font-size: 14px; white-space: pre-line; }
  .status:empty { margin: 0; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
  .status.busy::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px; border: 2px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search { background: #0f0d0b; border: 1px solid var(--line2); border-radius: 99px; color: var(--text); padding: 7px 14px; font: inherit; font-size: 13px; width: 180px; outline: 0; }
  .search:focus { border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .sound { display: flex; align-items: center; gap: 12px; background: #0f0d0b; border: 1px solid var(--line); border-radius: 12px; padding: 10px; transition: border-color .15s; }
  .sound:hover { border-color: var(--line2); }
  .sound .play { flex-basis: 34px; width: 34px; height: 34px; }
  .sound .play svg { width: 13px; height: 13px; }
  .sound .info { flex: 1; min-width: 0; }
  .sound .name { font-weight: 700; font-size: 15px; letter-spacing: .4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sound .meta { font-size: 12px; color: var(--dim); }
  .sound .del { background: none; border: 0; color: var(--dim); cursor: pointer; padding: 6px; border-radius: 8px; display: grid; place-items: center; }
  .sound .del:hover { color: var(--bad); background: rgba(255,107,91,.1); }
  .empty { color: var(--dim); text-align: center; padding: 26px 0; font-size: 14px; grid-column: 1 / -1; }

  footer { margin-top: 30px; text-align: center; }
  details.admin { display: inline-block; text-align: left; font-size: 13px; color: var(--dim); }
  details.admin summary { cursor: pointer; list-style: none; text-align: center; }
  details.admin summary::-webkit-details-marker { display: none; }
  details.admin[open] { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .adminrow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .adminrow input { background: #0f0d0b; border: 1px solid var(--line2); border-radius: 8px; color: var(--text); padding: 8px 10px; font: inherit; }
  .adminrow .btn { padding: 8px 14px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>SaySounds</h1>
    <div class="quota"><span class="dots" id="dots"><i></i><i></i></span><span id="quotaText">…</span></div>
  </header>

  <section class="card">
    <div class="card-title"><h2>Subir sonido</h2><span class="specs">MP3 · 192 kbps · 44,1 kHz · estéreo · máx. 15 s</span></div>

    <label class="drop" id="drop">
      <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.aac">
      <div class="icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div><b id="dropTitle">Elige o arrastra un audio</b><span id="dropSub">mp3, wav, ogg, m4a, flac…</span></div>
    </label>

    <div class="wave" id="wave">
      <button class="play" id="previewPlay" title="Escuchar" type="button"></button>
      <canvas id="canvas" height="56"></canvas>
      <div class="time" id="dur">0.0 s</div>
    </div>

    <div class="fields">
      <div>
        <label class="lbl" for="name">Palabra para el chat <em>a-z, 0-9, _</em></label>
        <div class="namebox"><input type="text" id="name" maxlength="7" autocomplete="off" spellcheck="false" placeholder="hola"><span class="count" id="count">0/7</span></div>
      </div>
      <div>
        <label class="lbl" for="volume">Volumen en el juego</label>
        <div class="vol"><input type="range" id="volume" min="0.2" max="2" step="0.1" value="1"><output id="volOut">1.0</output></div>
      </div>
    </div>

    <label class="toggle"><input type="checkbox" id="normalize" checked> Normalizar volumen</label>

    <div class="bar">
      <button class="btn" id="upload" disabled>Subir</button>
      <span class="specs" id="sizeInfo"></span>
    </div>
    <div class="status" id="upStatus"></div>
  </section>

  <section class="card">
    <div class="card-title"><h2>Sonidos <span id="total"></span></h2><input class="search" id="search" placeholder="Buscar…"></div>
    <div class="grid" id="list"></div>
    <div class="status" id="listStatus"></div>
  </section>

  <footer>
    <details class="admin" id="adminBox">
      <summary>Admin</summary>
      <div class="adminrow">
        <input type="password" id="adminKey" placeholder="Clave" autocomplete="off">
        <button class="btn" id="saveAdmin">Entrar</button>
        <button class="btn ghost" id="clearAdmin">Salir</button>
      </div>
    </details>
  </footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script src="bzip2.js"></script>
<script>
'use strict';
const REPO = 'Amnhesia/fast.dl', BRANCH = 'main';
const LIST_PATH = 'saysounds/list.json';
const SOUND_DIR = 'left4dead2/sound/saysounds_web';
const API = 'https://api.github.com/repos/' + REPO;
const RATE = 44100, KBPS = 192, CHANNELS = 2, MAX_SECONDS = 15, MAX_NAME = 7;
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const ICON_DEL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>';

const $ = id => document.getElementById(id);
let worker = '';
let adminKey = '';
try { adminKey = localStorage.getItem('ss_admin') || ''; } catch (e) {}
let sounds = [], serverNames = [], converted = null, remaining = null, previewUrl = '';
const player = new Audio();
let playingBtn = null;

function setStatus(el, text, kind) { el.textContent = text; el.className = 'status' + (kind ? ' ' + kind : ''); }

// ----------------------------------------------------------------------------- Reproductor (uno para toda la página)
function playUrl(url, btn) {
  if (playingBtn === btn && !player.paused) { player.pause(); return; }
  player.src = url;
  player.play().catch(() => {});
  setPlaying(btn);
}
function setPlaying(btn) {
  if (playingBtn) playingBtn.innerHTML = ICON_PLAY;
  playingBtn = btn;
  if (btn) btn.innerHTML = ICON_STOP;
}
player.onended = player.onpause = () => setPlaying(null);

// ----------------------------------------------------------------------------- Worker y GitHub
async function callWorker(path, body) {
  if (!worker) throw new Error('La subida no está disponible ahora.');
  const headers = { 'Content-Type': 'text/plain;charset=UTF-8' };
  if (adminKey) headers['X-Admin-Key'] = adminKey;
  const res = await fetch(worker + path, body === undefined ? { headers } : { method: 'POST', headers, body });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(data.error || ('error ' + res.status));
  return data;
}

async function refreshQuota() {
  const dots = $('dots').children;
  if (!worker) { $('quotaText').textContent = 'subida no disponible'; return; }
  try {
    const st = await callWorker('/status');
    remaining = st.remaining;
    if (st.admin) {
      $('quotaText').textContent = 'admin · sin límite';
      for (const d of dots) d.className = 'on';
    } else {
      $('quotaText').textContent = st.remaining === 0 ? 'vuelve mañana' : ('te quedan ' + st.remaining + ' hoy');
      for (let i = 0; i < dots.length; i++) dots[i].className = i < st.remaining ? 'on' : '';
    }
  } catch (e) { $('quotaText').textContent = 'sin conexión'; }
  updateButtons();
}

function b64(bytes) {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}

async function readList() {
  const res = await fetch(API + '/contents/' + LIST_PATH + '?ref=' + BRANCH + '&t=' + Date.now(), { headers: { 'Accept': 'application/vnd.github.raw+json' } });
  if (res.status === 404) return [];
  if (!res.ok) throw new Error('No se pudo leer la lista (' + res.status + ')');
  const data = await res.json();
  return Array.isArray(data.sounds) ? data.sounds : [];
}

// ----------------------------------------------------------------------------- Conversión: MP3 192 kbps CBR, 44,1 kHz, estéreo, máx. 15 s
function cleanName(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\.[a-z0-9]+$/, '').replace(/[^a-z0-9]+/g, '_').replace(/^_+/, '').slice(0, MAX_NAME).replace(/_+$/, '');
}

async function convert(file, normalize) {
  const data = await file.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try { decoded = await ctx.decodeAudioData(data); }
  catch (e) { throw new Error('No se pudo leer ese audio. Prueba con mp3 o wav.'); }
  finally { ctx.close(); }

  const seconds = Math.min(decoded.duration, MAX_SECONDS);
  const frames = Math.max(1, Math.ceil(seconds * RATE));
  const off = new OfflineAudioContext(CHANNELS, frames, RATE);
  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start(0);
  const rendered = await off.startRendering();
  const L = rendered.getChannelData(0), R = rendered.getChannelData(1);

  // Fundido corto al final si se recortó (evita el "clic")
  const cut = decoded.duration > MAX_SECONDS;
  if (cut) {
    const fade = Math.min(L.length, Math.round(RATE * 0.04));
    for (let i = 0; i < fade; i++) { const g = i / fade; L[L.length - 1 - i] *= g; R[R.length - 1 - i] *= g; }
  }

  let peak = 0;
  for (let i = 0; i < L.length; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
  const gain = normalize && peak > 0.001 ? 0.95 / peak : 1;
  const toInt = ch => {
    const out = new Int16Array(ch.length);
    for (let i = 0; i < ch.length; i++) {
      const v = Math.max(-1, Math.min(1, ch[i] * gain));
      out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    return out;
  };
  const left = toInt(L), right = toInt(R);

  if (typeof lamejs === 'undefined') throw new Error('No cargó el codificador MP3. Recarga la página.');
  const enc = new lamejs.Mp3Encoder(CHANNELS, RATE, KBPS);
  const parts = [];
  const push = out => { if (out.length) parts.push(new Uint8Array(out.buffer, out.byteOffset, out.length).slice()); };
  for (let i = 0; i < left.length; i += 1152) push(enc.encodeBuffer(left.subarray(i, i + 1152), right.subarray(i, i + 1152)));
  push(enc.flush());
  const mp3 = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  let o = 0;
  for (const p of parts) { mp3.set(p, o); o += p.length; }

  return { mp3, seconds, cut, pcm: L, gain };
}

function drawWave(pcm, gain) {
  const c = $('canvas'), dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth || 600, h = 56;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);
  const bars = Math.max(1, Math.floor(w / 4)), step = Math.max(1, Math.floor(pcm.length / bars));
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#ffd38a'); grad.addColorStop(.5, '#f0a430'); grad.addColorStop(1, '#ff6a2b');
  g.fillStyle = grad;
  for (let b = 0; b < bars; b++) {
    let peak = 0;
    for (let i = b * step; i < (b + 1) * step && i < pcm.length; i++) peak = Math.max(peak, Math.abs(pcm[i]));
    const bh = Math.max(2, Math.min(1, peak * gain) * (h - 6));
    g.fillRect(b * 4, (h - bh) / 2, 2.5, bh);
  }
}

// ----------------------------------------------------------------------------- Formulario
$('previewPlay').innerHTML = ICON_PLAY;
$('volume').oninput = () => { $('volOut').textContent = (+$('volume').value).toFixed(1); };
$('normalize').onchange = () => { if ($('file').files[0]) prepare(); };
function onName() {
  const v = $('name').value, clean = v.toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, MAX_NAME);
  if (v !== clean) $('name').value = clean;
  $('count').textContent = clean.length + '/' + MAX_NAME;
  $('count').classList.toggle('full', clean.length === MAX_NAME);
  updateButtons();
}
$('name').oninput = onName;

const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, () => drop.classList.add('over')));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('over')));
$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  $('dropTitle').textContent = f.name;
  $('dropSub').textContent = 'Toca para cambiar el archivo';
  if (!$('name').value) { $('name').value = cleanName(f.name); onName(); }
  prepare();
};

async function prepare() {
  converted = null;
  updateButtons();
  setStatus($('upStatus'), 'Convirtiendo…', 'busy');
  try {
    converted = await convert($('file').files[0], $('normalize').checked);
    player.pause();
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(new Blob([converted.mp3], { type: 'audio/mpeg' }));
    $('wave').classList.add('show');
    requestAnimationFrame(() => drawWave(converted.pcm, converted.gain));
    $('dur').textContent = converted.seconds.toFixed(1) + ' s';
    $('sizeInfo').textContent = Math.round(converted.mp3.length / 1024) + ' KB' + (converted.cut ? ' · recortado a 15 s' : '');
    setStatus($('upStatus'), '');
  } catch (e) {
    $('wave').classList.remove('show');
    setStatus($('upStatus'), e.message, 'bad');
  }
  updateButtons();
}
window.addEventListener('resize', () => { if (converted) drawWave(converted.pcm, converted.gain); });

$('previewPlay').onclick = () => { if (converted) playUrl(previewUrl, $('previewPlay')); };

function nameProblem(name) {
  if (!new RegExp('^[a-z0-9_]{2,' + MAX_NAME + '}$').test(name)) return 'La palabra debe tener de 2 a ' + MAX_NAME + ' caracteres.';
  if (sounds.some(s => s.name === name)) return 'Ya existe un sonido con esa palabra.';
  if (serverNames.includes(name)) return 'Esa palabra ya la usa un sonido del servidor.';
  return '';
}

function updateButtons() {
  $('upload').disabled = !converted || !worker || remaining === 0 || $('name').value.length < 2;
}

$('upload').onclick = async () => {
  const name = $('name').value.trim();
  const problem = nameProblem(name);
  if (problem) return setStatus($('upStatus'), problem, 'bad');
  $('upload').disabled = true;
  try {
    setStatus($('upStatus'), 'Comprimiendo…', 'busy');
    await new Promise(r => setTimeout(r, 30));
    const bz = Bzip2.compress(converted.mp3);
    setStatus($('upStatus'), 'Subiendo…', 'busy');
    const volume = (+$('volume').value).toFixed(1);
    await callWorker('/upload', name + '\n' + volume + '\n' + b64(converted.mp3) + '\n' + b64(bz));

    sounds = await readList().catch(() => sounds.concat([{ name, volume: +volume }]));
    renderList();
    setStatus($('upStatus'), '¡Listo! Escribe ' + name + ' en el chat desde el próximo mapa.', 'ok');
    $('file').value = ''; $('name').value = ''; onName();
    $('dropTitle').textContent = 'Elige o arrastra un audio'; $('dropSub').textContent = 'mp3, wav, ogg, m4a, flac…';
    $('wave').classList.remove('show'); $('sizeInfo').textContent = '';
    converted = null;
  } catch (e) {
    setStatus($('upStatus'), e.message, 'bad');
  }
  refreshQuota();
};

// ----------------------------------------------------------------------------- Lista
async function removeSound(name) {
  if (!confirm('¿Borrar "' + name + '"?')) return;
  try {
    setStatus($('listStatus'), 'Borrando…', 'busy');
    await callWorker('/delete', name);
    sounds = sounds.filter(s => s.name !== name);
    renderList();
    setStatus($('listStatus'), 'Borrado.', 'ok');
  } catch (e) { setStatus($('listStatus'), e.message, 'bad'); }
}

function renderList() {
  const box = $('list'), q = $('search').value.trim().toLowerCase();
  box.textContent = '';
  $('total').textContent = sounds.length ? '· ' + sounds.length : '';
  const items = sounds.filter(s => s.name.includes(q)).sort((a, b) => a.name.localeCompare(b.name));
  if (!items.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = sounds.length ? 'Nada coincide con la búsqueda.' : 'Todavía no hay sonidos.';
    box.appendChild(e);
    return;
  }
  for (const s of items) {
    const card = document.createElement('div'); card.className = 'sound';
    const btn = document.createElement('button'); btn.className = 'play'; btn.type = 'button'; btn.innerHTML = ICON_PLAY; btn.title = 'Escuchar';
    btn.onclick = () => playUrl('https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/' + SOUND_DIR + '/' + s.name + '.mp3', btn);
    const info = document.createElement('div'); info.className = 'info';
    const n = document.createElement('div'); n.className = 'name'; n.textContent = s.name;
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = 'vol ' + (+s.volume).toFixed(1) + (s.added ? ' · ' + s.added : '');
    info.append(n, m);
    card.append(btn, info);
    if (adminKey) {
      const d = document.createElement('button'); d.className = 'del'; d.title = 'Borrar'; d.innerHTML = ICON_DEL;
      d.onclick = () => removeSound(s.name);
      card.appendChild(d);
    }
    box.appendChild(card);
  }
}
$('search').oninput = renderList;

// ----------------------------------------------------------------------------- Admin
function showAdmin() {
  $('adminKey').value = adminKey ? '••••••••' : '';
  renderList();
  refreshQuota();
}
$('saveAdmin').onclick = () => {
  const v = $('adminKey').value.trim();
  if (!v || v.startsWith('•')) return;
  adminKey = v;
  try { localStorage.setItem('ss_admin', adminKey); } catch (e) {}
  showAdmin();
};
$('clearAdmin').onclick = () => {
  adminKey = '';
  try { localStorage.removeItem('ss_admin'); } catch (e) {}
  showAdmin();
};

// ----------------------------------------------------------------------------- Inicio
(async function init() {
  try {
    const r = await fetch('config.json?t=' + Date.now());
    if (r.ok) worker = ((await r.json()).worker || '').replace(/\/+$/, '');
  } catch (e) {}
  // Palabras de saysounds.cfg: las tiene el Worker (las manda el servidor en cada mapa); si no, la copia del repo
  try {
    const r = await fetch(worker ? worker + '/names' : 'server_names.json?t=' + Date.now());
    if (r.ok) serverNames = (await r.json()).names || [];
  } catch (e) {}
  try { sounds = await readList(); } catch (e) { setStatus($('listStatus'), e.message, 'bad'); }
  showAdmin();
})();
</script>
</body>
